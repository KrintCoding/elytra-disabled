# ===================================================================
# Mesaj formatı
# ===================================================================
# Düz metin = seslendirmesiz sohbet mesajı (örnek: reload_success).
# actionbar/title/ses için liste kullanın: ilk satır [köşeli parantez] içinde
# ayarları belirler, geri kalanı metindir (& renk kodlarıyla):
#
# equip_blocked:
#   - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
#   - '&cEngellendi!'
#   - '&7Bu dünyada elytra kuşanmak yasaktır'
#
# type: chat (varsayılan) / actionbar / title
# title_times: "görünme:kalma:kaybolma" tik cinsinden (20 tik = 1 saniye), sadece title için
# sound: "ses;ses seviyesi;perde" - minecraft:entity.villager.no ya da ENTITY_VILLAGER_NO,
#        ses seviyesi/perde isteğe bağlı
# chat tüm satırları gönderir, actionbar sadece ilkini, title ilk + ikinci satırı (alt başlık)
#
# Bir mesajı devre dışı bırakmak için değerini false yapın (anahtarı SİLMEYİN veya
# yorum satırına almayın - /reload sırasında eklenti dosyanızda eksik olan anahtarları
# varsayılanlardan geri ekler, ama açık false'a dokunmaz):
#
# equip_blocked: false
# ===================================================================

# Elytra takmaya çalışırken gösterilen mesaj
equip_blocked:
  - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
  - '&cEngellendi!'
  - '&7Bu dünyada elytra kuşanmak yasaktır'

# Uçmaya çalışırken gösterilen mesaj
glide_blocked:
  - '[type="title",title_times="10:40:10",sound="minecraft:entity.villager.no;1.0;1.0"]'
  - '&cEngellendi!'
  - '&7Bu dünyada elytra ile uçuş devre dışıdır'

# Elytra otomatik olarak çıkarıldığında gösterilen mesaj
removed_on_enter: "&eBu dünyaya giriş yaptığınız için elytranız envanterinize alındı."

# Eklenti yeniden yüklenirken gösterilen mesajlar
reload_success: "&a&l[ElytraDisabled]&r &aYapılandırma başarıyla yeniden yüklendi!"
reload_error: "&c&l[ElytraDisabled]&r &cYapılandırma yeniden yüklenirken hata oluştu!"

# Komut yardım mesajı
help_reload: "&e/elytra-disabled reload &8- &7Yapılandırmayı yeniden yükle"

# Yetki olmadığında gösterilen mesaj
no_permission: "&cBu komutu kullanmak için yetkiniz yok!"

# PlaceholderAPI metni (%elytradisabled_world_disabled%, %elytradisabled_bypass%,
# %elytradisabled_blocked%) true/false değerleri için - "Evet"/"Hayır" gibi değiştirebilirsiniz.
placeholder_true: "evet"
placeholder_false: "hayır"
